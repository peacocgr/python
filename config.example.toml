# Copy to config.toml and adjust. No credentials go here: run
# `rhtrader login` once to authorize via Robinhood's OAuth sign-in page.

symbols = ["SPY", "QQQ"]
trade_log = "state/trades.jsonl"

[strategy]
# Long while the fast SMA is above the slow SMA; flat otherwise.
fast = 50
slow = 200

[portfolio]
# Per-symbol allocation while its signal is on. Omit for an equal split.
# max_position_pct = 0.25
cash_buffer_pct = 0.02
# Fractional shares require market orders on Robinhood. Whole shares let
# the bot use protective limit orders.
fractional = false

[execution]
slippage_bps = 5       # backtest/paper cost model
commission = 0.0
limit_buffer_bps = 20  # limit price = last price +/- 0.20%

[risk]
max_order_notional = 5000
max_orders_per_run = 10
max_data_age_days = 5
kill_switch_file = "KILL"  # `touch KILL` to stop all new orders

[broker]
mode = "paper"  # "paper" or "live"
paper_state = "state/paper.json"
paper_starting_cash = 10000

[data]
# "csv" reads data/<SYMBOL>.csv; "robinhood" fetches fresh daily bars
# over OAuth (run `rhtrader login` first). Use "robinhood" for real paper trading.
source = "csv"
csv_dir = "data"

[robinhood]
# Robinhood Agentic Trading MCP server (OAuth 2.1 + PKCE).
mcp_url = "https://agent.robinhood.com/mcp/trading"
# The account you enabled for agentic trading; `rhtrader accounts` prints it.
# Required for broker.mode = "live".
account_number = ""
token_file = "~/.config/rhtrader/oauth.json"  # created with mode 0600
callback_port = 8765                           # local port for the OAuth redirect
review_orders = true  # run Robinhood's pre-trade review; skip orders it flags
